name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试与启动检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 跑测试
        run: bun test

      - name: 冒烟启动（确认服务能起来并响应 /healthz）
        run: |
          bun run src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then
              echo "✅ /healthz 正常"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          kill $SERVER_PID

      - name: 确认没有把数据库或上传文件提交进来
        run: |
          if git ls-files | grep -E '^(data/.*\.db|uploads/[^.]|root/)' ; then
            echo "❌ 仓库里混进了数据库/上传/本机运行时"; exit 1
          else
            echo "✅ 工作区干净"
          fi

  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yetan-forum:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
